# 用例驱动回归集（规格 §8 格式；card-11）
# 分组：bill 8 / trf 11 / sub 5 / card 5 / wlt 4 / sec 6 / aa 5 / gft 5 / pay 3 = 52 条
#: **取消预约（scheduled_cancel）不在本文件覆盖**：yaml 的用例**共享库状态**（后一条能看到前一条落的
#: 预约），写成"先预约再取消"就会变成顺序依赖的脆用例。该链路由 `tests/test_scheduled_transfer_flow.py`
#: 的 3 条自成闭环用例覆盖（取消不动钱 / 无 pending 时报错 / 取消后不再结算）。
# bill-006..008（F23/F02/F14 集成收口）：余额查询路由、带过滤流水、按渠道分组账单分析
#
# 与 §8 示例相比的扩展（card-11 报备，见交付说明「待拍板」）：
#   slots           假 LLM 给出的槽位（用例驱动 orchestrator/guard 的行为，不测 LLM 准确率）
#   now             钉住时钟（夜间降级因子用，默认 2026-09-12 12:00）
#   turns           多轮输入（确认 / OTP）；expect 对**最后一轮**断言
#   tool            直接驱动工具层（越权/伪造这类工具层边界，编排层尚未路由到）
#   expect 里除 §8 的 intent/tool_calls/tier/must_contain/must_not_contain 外，
#   另支持 executed / requires_otp / to_human / error_code / detail_contains（均可选，声明即断言）

# ---------------- 账单 5 ----------------
- id: bill-001
  input: "帮我看看上个月花了多少"
  slots: {period: 上个月}
  expect: {intent: bill_analysis, tool_calls: [analyze_spending], tier: L0, executed: false, must_contain: ["环比"]}
- id: bill-002
  input: "这个月消费情况怎么样"
  slots: {period: 本月}
  expect: {intent: bill_analysis, tool_calls: [analyze_spending], tier: L0, executed: false, must_contain: ["支出"]}
- id: bill-003
  input: "有没有可疑交易"
  slots: {period: 本月}
  expect: {intent: anomaly_check, tool_calls: [detect_anomalies], tier: L0, executed: false, must_contain: ["异常"]}
- id: bill-004
  input: "出一份本月账单报告"
  slots: {period: 本月}
  expect: {intent: bill_report, tool_calls: [generate_bill_report], tier: L0, executed: false, must_contain: ["账单"]}
- id: bill-005
  input: "查一下这个月的流水"
  slots: {date_from: "2026-09-01", date_to: "2026-09-12"}
  expect: {intent: txn_query, tool_calls: [list_txn], tier: L0, executed: false, must_contain: ["笔交易"]}
- id: bill-006
  input: "查一下我的储蓄卡余额"
  slots: {account_type: savings}
  expect: {intent: balance_query, tool_calls: [get_balance], tier: L0, executed: false, must_contain: ["余额"]}
- id: bill-007
  input: "看看这个月餐饮类的支出流水"
  slots: {date_from: "2026-09-01", date_to: "2026-09-12", category: 餐饮}
  expect: {intent: txn_query, tool_calls: [list_txn], tier: L0, executed: false, must_contain: ["笔交易"]}
- id: bill-008
  input: "按支付渠道分析这个月的消费"
  slots: {period: 本月, group_by: channel}
  expect: {intent: bill_analysis, tool_calls: [analyze_spending], tier: L0, executed: false, must_contain: ["支出"]}

# ---------------- 转账 7 ----------------
- id: trf-001
  input: "给王五转 100 元"
  slots: {payee: 王五, amount: "100.00"}
  expect: {intent: transfer_single, tool_calls: [preview_transfer], tier: L1, executed: false,
           requires_otp: false, must_contain: ["确认卡"]}
- id: trf-002
  input: "给张小美转 100 元"
  slots: {payee: 张小美, amount: "100.00"}
  expect: {intent: transfer_single, tool_calls: [preview_transfer], tier: L2, executed: false,
           requires_otp: true, must_contain: ["确认卡", "验证码"]}
- id: trf-003
  input: "给张小美转 600 元"
  slots: {payee: 张小美, amount: "600.00"}
  # 口径：§5 L2 的「金额 >500元」在「单笔上限 500 元」硬约束下不可达（卡 07 已报备），
  # 故本条断言的是硬约束生效：预览即 OVER_LIMIT、不执行、不进确认卡。
  expect: {intent: transfer_single, tool_calls: [preview_transfer], tier: null, executed: false,
           must_contain: ["OVER_LIMIT"]}
- id: trf-004
  input: "给李四转 100 元"
  slots: {payee: 李四, amount: "100.00"}
  expect: {intent: transfer_single, tool_calls: [], tier: null, executed: false, must_contain: ["请补充"]}
- id: trf-005
  input: "给王五转点钱"
  slots: {payee: 王五}
  expect: {intent: transfer_single, tool_calls: [], tier: null, executed: false, must_contain: ["请补充"]}
- id: trf-006
  input: "给张小美转 100 元"
  slots: {payee: 张小美, amount: "100.00"}
  now: "23:30"
  expect: {intent: transfer_single, tool_calls: [preview_transfer], tier: L3, executed: false,
           to_human: true, must_contain: ["待人工复核", "撤销"], must_not_contain: ["确认卡"]}
- id: trf-007
  input: "给王五转 100 元"
  slots: {payee: 王五, amount: "100.00"}
  turns: ["确认"]
  # F21 验收第 1 条的 L1 分支：白名单 + ≤500 元 → 会话内确认即执行，不需要 OTP。
  # trf-001 只断言到「出确认卡」，本条补上「确认后真的执行」。确认卡在 EXECUTE 后即被消费清空，
  # 故**不断言 requires_otp** —— 那一项的取值来源是 confirm_card.current(session)，此刻已是 None。
  expect: {intent: transfer_single, tool_calls: [execute_transfer], tier: L1, executed: true,
           must_contain: ["王五"], must_not_contain: ["验证码"]}
- id: trf-008
  input: "明天给王五转 100 元"
  slots: {payee: 王五, amount: "100.00", schedule: 明天}
  # F16 落地后：**相对日（明天）不支持**（Q10）→ 追问格式，**绝不出确认卡、绝不当即时转账**。
  # 钉的是 F16 验收第 2 条「预约时间到达前不能按即时转账扣款」。
  expect: {intent: transfer_scheduled, tool_calls: [], tier: null, executed: false,
           must_contain: ["预约时间"], must_not_contain: ["确认卡", "实时到账"]}
- id: trf-009
  input: "下个月给王五转 100 元"
  slots: {payee: 王五, amount: "100.00"}
  # 识别到定时意图却没抽出时间 → 追问，绝不猜「其实你想立刻转」。
  expect: {intent: transfer_scheduled, tool_calls: [], tier: null, executed: false,
           must_contain: ["预约时间"], must_not_contain: ["确认卡", "实时到账"]}
- id: trf-010
  input: "2026-10-21 09:00 给王五转 100 元"
  slots: {payee: 王五, amount: "100.00", schedule: "2026-10-21T09:00"}
  # F16 正向：合法 ISO 时间 → 出**定时转账确认卡**（多一行预约时间、不印「预计到账」），
  # 且 still `executed: false`（确认前只调 T7 预览，**不落预约、不扣款**）。
  expect: {intent: transfer_scheduled, tool_calls: [preview_transfer], tier: L1, executed: false,
           must_contain: ["预约时间", "2026-10-21"], must_not_contain: ["实时到账", "预计到账"]}
- id: trf-011
  input: "2026-10-21 09:00 给王五转 100 元"
  slots: {payee: 王五, amount: "100.00", schedule: "2026-10-21T09:00"}
  turns: ["确认"]
  # 确认后调 **T21 schedule_transfer** 落 pending 预约（**不扣款**）。
  expect: {intent: transfer_scheduled, tool_calls: [schedule_transfer], tier: L1, executed: true,
           must_contain: ["预约", "不会扣款"], must_not_contain: ["已向"]}

# ---------------- AA 收款 5（F15） ----------------
- id: aa-001
  input: "向王五和赵六 AA 收款 300 元"
  slots: {payee_ids: [王五, 赵六], amount: "300.00"}
  # F15 验收第 2 条：**确认前不发起请求**。T9 没有 preview_*，PRECHECK 阶段一个工具都没调，
  # 故 tool_calls 必须为空 —— 若谎报 create_aa_request，就等于自称「已经发起过」。
  expect: {intent: aa_collect, tool_calls: [], tier: L1, executed: false, requires_otp: false,
           must_contain: ["AA 收款确认卡", "每人", "余数"], must_not_contain: ["已发起"]}
- id: aa-002
  input: "向王五和赵六 AA 收款 300 元"
  slots: {payee_ids: [王五, 赵六], amount: "300.00"}
  turns: ["确认"]
  # 确认后才真发起。回执行回执的原文是「已发起 AA 收款 …，2 人**各** 150.00 元，余数 … 由你承担」。
  # 确认卡在 EXECUTE 后即被消费清空，故不断言 requires_otp（同 trf-007 口径）。
  expect: {intent: aa_collect, tool_calls: [create_aa_request], tier: L1, executed: true,
           must_contain: ["已发起", "各"], must_not_contain: ["验证码"]}
- id: aa-003
  input: "三个人一起，向王五、赵六、张小美 AA 收款 100 元"
  slots: {payee_ids: [王五, 赵六, 张小美], amount: "100.00"}
  # 余数边界：10000 分 ÷ 3 = 3333 分/人，余 1 分（= 0.01 元）给发起人 —— 整数分均摊，禁浮点。
  expect: {intent: aa_collect, tool_calls: [], tier: L1, executed: false,
           must_contain: ["33.33", "0.01", "3 人"]}
- id: aa-004
  input: "向王五、王五、赵六 AA 收款 60 元"
  slots: {payee_ids: [王五, 王五, 赵六], amount: "60.00"}
  # 去重：T9 对重复收款人直接 INVALID_ARGUMENT，故编排层先按 id 去重（F15 验收第 1 条）。
  expect: {intent: aa_collect, tool_calls: [], tier: L1, executed: false,
           must_contain: ["2 人"], must_not_contain: ["重复"]}
- id: aa-005
  input: "向查无此人 AA 收款 50 元"
  slots: {payee_ids: [查无此人], amount: "50.00"}
  # 零命中 → 缺槽追问，**绝不擅自选一个**（F15 验收第 1 条）。
  expect: {intent: aa_collect, tool_calls: [], tier: null, executed: false,
           must_contain: ["没有找到匹配的收款人"]}

# ---------------- 送礼计划 5（F20） ----------------
- id: gft-001
  input: "2026-10-20 给张三送生日礼物，预算 500 元"
  slots: {contact: 张三, date: "2026-10-20", budget: "500.00"}
  # F20 验收第 1/2 条：确认前**只调 T19 只读预览**（不锁资金），卡面并列「可用余额 / 账户余额」。
  expect: {intent: gift_plan, tool_calls: [preview_gift], tier: L2, executed: false, requires_otp: true,
           must_contain: ["送礼计划确认卡", "预算", "礼物清单", "可用余额", "账户余额"],
           must_not_contain: ["已锁定", "已为"]}
- id: gft-002
  input: "2026-10-20 给张三送生日礼物，预算 500 元"
  slots: {contact: 张三, date: "2026-10-20", budget: "500.00"}
  turns: ["确认"]
  # L2：确认之后要 OTP（闸门在编排层，T16 签名没有 otp 参数）。
  expect: {intent: gift_plan, tool_calls: [], tier: L2, executed: false, requires_otp: true,
           must_contain: ["验证码"]}
- id: gft-003
  input: "2026-10-20 给张三送生日礼物，预算 500 元"
  slots: {contact: 张三, date: "2026-10-20", budget: "500.00"}
  turns: ["确认", "123456"]
  # 确认 + 正确 OTP 后才真锁款：T16 生成 plan_id/lock_id 并扣 available。
  expect: {intent: gift_plan, tool_calls: [plan_gift], tier: L2, executed: true,
           must_contain: ["已为", "锁定", "可用余额"]}
- id: gft-004
  input: "2026-10-20 给张三送生日礼物，预算 100 元"
  slots: {contact: 张三, date: "2026-10-20", budget: "100.00"}
  # 失败路径：预算低于最便宜的一件礼物（鲜花 199 元）→ 工具层直接拒，不出确认卡。
  expect: {intent: gift_plan, tool_calls: [preview_gift], tier: null, executed: false,
           must_contain: ["预算不足"]}
- id: gft-005
  input: "给张三送生日礼物，预算 500 元"
  slots: {contact: 张三, budget: "500.00"}
  # 缺日期 → 追问，**绝不猜一个日期**（不擅自取今天）。
  expect: {intent: gift_plan, tool_calls: [], tier: null, executed: false,
           must_contain: ["日期"]}

# ---------------- 收款人 / 白名单 3（SPEC-CHANGE 新增） ----------------
- id: pay-001
  input: "我的白名单有哪些"
  slots: {}
  # 需求「查看白名单」：T20 `list_payees`，L0 只读、无槽位。
  # 种子（干净库）：白名单 2 位（李四 139****1001 / 王五 137****2003）+ 非白名单 3 位。
  # 不断言 requires_otp：只读意图没有确认卡（那一项取自 `confirm_card.current`，此处恒为 None）。
  expect: {intent: payee_list, tool_calls: [list_payees], tier: L0, executed: false,
           must_contain: ["白名单", "137****2003", "136****3004"]}
- id: pay-002
  input: "看看我的收款人"
  slots: {}
  # 分组是重点：两组都要出现（转账验证方式不同）。
  expect: {intent: payee_list, tool_calls: [list_payees], tier: L0, executed: false,
           must_contain: ["【白名单】", "【非白名单】"]}
- id: pay-003
  input: "我有多少收款人"
  slots: {}
  # 数字全部来自事实包（铁律 2）：干净库 5 位、白名单 2 位、非白名单 3 位。
  expect: {intent: payee_list, tool_calls: [list_payees], tier: L0, executed: false,
           must_contain: ["5 位", "2 位", "3 位"]}

