# 一键起两件事（同一镜像、共享一份合成数据卷）：
#   评测入口  http://127.0.0.1:8000/api/chat   （POST {"text": "查一下余额"}）
#   网页端    http://127.0.0.1:8501
#
# 用法：
#   cp .env.example .env      # 可选：填 LLM_API_KEY 才会真的走大模型；不填也能起（降级演示）
#   docker compose up --build
#   验收：docker compose exec api bash scripts/verify.sh
#
# 注：`env_file` 用的是 compose ≥ 2.24 的长语法（required: false，.env 缺失也不报错）；
#     老版本 compose 可把这两段 env_file 删掉，改用 `docker compose --env-file .env up`。
# 注：健康检查按 **service** 定义（镜像里故意没有全局 HEALTHCHECK）—— 两个服务端口/端点不同，
#     探针写进共享镜像会让另一个服务继承到错端口的探针、永远 unhealthy（真机踩过的坑）。
#     探针只用 stdlib `urllib`：python:3.11-slim 里没有 curl，也不为此引入新依赖。
# 注（卡 20-C，真机踩过的坑）：**卷只挂 /app/var，绝不挂 /app/data**。
#     `data/` 是**代码目录**（dao.py / _dao_core.py / db.py / schema.sql / seed.py），库文件现在住 `var/bank.db`。
#     早期把整卷挂在 /app/data 上 → 第一次建卷时的旧 `dao.py` 把 /app/data **整个盖住**：容器里跑的是旧代码，
#     `--build` 重建镜像也救不了（卷盖在镜像之上），表现为网页端「加个收款人」一提交就
#     500 `AttributeError: module 'data.dao' has no attribute 'insert_payee'`。
#     铁律：**卷只能挂数据目录，不能挂任何含代码的目录**。
# 注：时区由**镜像**统一钉住（Dockerfile：`ENV TZ=Asia/Shanghai` + 装 tzdata）——「夜间时段」降级因子、
#     单日累计的日界、审计/回执时间戳都读进程本地时间；容器默认 UTC 会把 CST 用户的昼夜判反（真机踩过）。
#     要按服务覆盖就加 `environment: {TZ: Asia/Tokyo}`（compose 的 environment 优先于镜像 ENV）。
services:
  api:
    build: .
    image: ai-banking-agent:latest
    container_name: banking-api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      DB_PATH: var/bank.db          # 库文件在**数据目录** /app/var，不在代码目录 /app/data
    env_file:
      - path: .env
        required: false
    volumes:
      - bankdata:/app/var           # 与网页端共享：在网页端转的账，评测入口也看得到（只挂库目录，不盖代码）
    ports:
      - "8000:8000"
    # 评测入口的健康端点：GET /healthz（interfaces/api/app.py）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      start_period: 15s             # 首次启动可能要先重建合成库，留出余量
      retries: 3
    restart: unless-stopped

  web:
    image: ai-banking-agent:latest
    container_name: banking-web
    depends_on:
      - api
    environment:
      DB_PATH: var/bank.db          # 与 api 同一个卷（bankdata → /app/var）的同一份库
      STREAMLIT_SERVER_HEADLESS: "true"
    env_file:
      - path: .env
        required: false
    volumes:
      - bankdata:/app/var
    ports:
      - "8501:8501"
    command:
      - streamlit
      - run
      - interfaces/web/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    # 网页端的健康端点：Streamlit 官方的 GET /_stcore/health（正常返回 ok）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      start_period: 30s             # Streamlit 比 uvicorn 起得慢，余量放宽
      retries: 5
    restart: unless-stopped

volumes:
  bankdata:
